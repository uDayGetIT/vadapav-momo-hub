<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vadapav & Momo Date Hub</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(to right, #c0fdfb, #fff6e0); margin:0; padding:0; display:flex; flex-direction:column; height:100vh; }
    #chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:5px; }
    .msg { max-width:60%; padding:8px 12px; border-radius:12px; }
    .self { background:#ffedcc; align-self:flex-end; }
    .partner { background:#cceeff; align-self:flex-start; }
    #inputArea { display:flex; gap:5px; padding:5px; }
    #inputArea input { flex:1; padding:5px; border-radius:5px; border:1px solid #ccc; }
    #surpriseArea { text-align:center; margin:10px; }
    button { cursor:pointer; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Vadapav 🌧️ ud0_0 x CompetitiveExpert973 🏙️ Momo</h2>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="chatInput" placeholder="Type a message...">
    <button id="emojiBtn">😊</button>
    <button id="sendBtn">Send</button>
  </div>

  <div style="text-align:center; margin:10px;">
    <button id="clickSurprise">Click Surprise!</button>
  </div>
  <div id="surpriseArea"></div>

  <div style="display:flex; justify-content:space-around; margin:10px;">
    <iframe id="podcast" width="45%" height="200" src="https://www.youtube.com/embed/2Vv-BfVoq4g?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    <iframe id="music" width="45%" height="200" src="" frameborder="0" allowfullscreen></iframe>
  </div>

  <script>
    // ------------------ CONFIG ------------------
    const firebaseConfig = {
      apiKey: "FIREBASE_API_KEY",
      authDomain: "FIREBASE_AUTH_DOMAIN",
      databaseURL: "FIREBASE_DATABASE_URL",
      projectId: "FIREBASE_PROJECT_ID",
      storageBucket: "FIREBASE_STORAGE_BUCKET",
      messagingSenderId: "FIREBASE_MESSAGING_SENDER_ID",
      appId: "FIREBASE_APP_ID",
    };
    const roomId = "vadapav-momo-night";
    const nickname = "ud0_0";
    const partner = "CompetitiveExpert973";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chatDiv = document.getElementById('chat');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const emojiBtn = document.getElementById('emojiBtn');
    const clickSurpriseBtn = document.getElementById('clickSurprise');
    const surpriseArea = document.getElementById('surpriseArea');
    const musicIframe = document.getElementById('music');

    const emojis = ['❤️','😂','🥟','🍔','🌧️','🏙️','🎶','✨'];

    function addMessage(from, text){
      const div = document.createElement('div');
      div.className = 'msg ' + (from===nickname?'self':'partner');
      div.textContent = text;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    sendBtn.onclick = () => {
      const text = chatInput.value.trim();
      if(!text) return;
      const msgObj = { from:nickname, text:text, ts:Date.now() };
      db.ref(`rooms/${roomId}/chat`).set({ message: msgObj });
      chatInput.value='';
      addMessage(nickname,text);
    };

    emojiBtn.onclick = () => {
      const emoji = emojis[Math.floor(Math.random()*emojis.length)];
      chatInput.value += emoji;
    };

    db.ref(`rooms/${roomId}/chat`).on('value',(snap)=>{
      const data = snap.val();
      if(data && data.message && data.message.from!==nickname){
        addMessage(data.message.from,data.message.text);
      }
    });

    const surprises = [
      'Hearts & food emojis! ❤️🥟🍔',
      'Meme: Long-distance snack debate 😂',
      'Surprise Track 🎵',
      'Which is spicier? Vadapav or Momo? 🌶️',
      'Vadapav + Momo = Best Combo ❤️',
      'Fireworks! From Mumbai rains to Dubai skies ✨'
    ];

    let clickCount=0;
    clickSurpriseBtn.onclick = ()=>{
      const surprise = surprises[clickCount%surprises.length];
      surpriseArea.textContent=surprise;
      if(surprise.includes('Track')){
        musicIframe.src='https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1';
      }
      clickCount++;
    };
  </script>
</body>
</html>
